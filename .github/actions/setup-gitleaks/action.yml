name: setup-gitleaks
description: Installs a pinned gitleaks release and verifies its SHA-256 before use.
runs:
  using: composite
  steps:
    - name: Install gitleaks 8.30.1 (checksum verified)
      shell: bash
      env:
        VERSION: 8.30.1
        SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
        curl -sSfL -o "${RUNNER_TEMP}/${tarball}" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${tarball}"
        echo "${SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
        mkdir -p "${RUNNER_TEMP}/gitleaks"
        tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
        echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/gitleaks/gitleaks" version
