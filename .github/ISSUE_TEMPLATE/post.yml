name: New post or page (ticket)
description: A ticket for the factory. The writing agent picks it up as soon as it is opened.
title: "Post: "
labels: [ticket]
body:
  - type: markdown
    attributes:
      value: |
        This ticket is a contract. The writing agent builds exactly what it says; the
        reviewing agent checks the result against the acceptance criteria.
  - type: textarea
    id: request
    attributes:
      label: What to publish
      description: Topic, audience, length, and any sources to cite (https links only).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkable line each.
      value: |
        - [ ] A new post in content/posts/ with title, date and description
        - [ ] Between 200 and 400 words
        - [ ] Cites at least one reputable https source
    validations:
      required: true
